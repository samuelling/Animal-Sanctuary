<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Animal Sanctuary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one-screen handheld — HUD strip, pixel stage, SNES-style controller deck.
   Deliberately single-theme: a 16-bit game world with Final-Fantasy-blue menu windows. */
:root{
  --night:#120e1c; --stage:#07050c;
  --win-top:#3b4cb0; --win-bot:#151c5c; --win-edge:#ece8ff; --btn:#1c2266; --btn-hi:#3644b8; --btn-edge:#9aa4ff;
  --ink:#f4f0ff; --muted:#bdb5df; --gold:#ffd25a; --good:#86e894; --bad:#ff8a7a;
  --deck-hi:#dcd8e6; --deck-lo:#b4afc4; --deck-edge:#948ea8; --dpad:#34313d; --dpad-hi:#4a4656;
  --btn-a:#8f7ce0; --btn-a-lo:#5f4cb0; --btn-b:#5a48a4; --btn-b-lo:#3a2c78; --deck-ink:#6a6480;
  --f-display:"Silkscreen","Courier New",monospace;
  --f-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;touch-action:manipulation;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app,#app *{touch-action:manipulation}
#stage,#deck,#deck *{touch-action:none}
.win,.win *{touch-action:pan-y}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;max-width:760px;margin:0 auto;
  padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 5px;background:linear-gradient(var(--win-top),var(--win-bot));
  border:2px solid var(--win-edge);border-radius:4px;font:600 15px/1.2 var(--f-body);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #000;min-width:0}
.chip img{width:18px;height:18px;image-rendering:pixelated;flex:none}
.chip small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.hbtn{font:400 11px/1 var(--f-display);letter-spacing:.06em;color:var(--ink);background:#241c3a;border:2px solid #5a4e80;border-radius:4px;padding:7px 8px;cursor:pointer;touch-action:manipulation}
.hbtn:hover{border-color:var(--win-edge)}
.hbtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}

/* Stage */
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:var(--stage);border-radius:6px;
  box-shadow:inset 0 0 0 2px #2c2440;overflow:hidden;touch-action:none}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);pointer-events:none;
  background:linear-gradient(var(--win-top),var(--win-bot));border:2px solid var(--win-edge);border-radius:4px;box-shadow:0 0 0 2px #0a0820;
  padding:6px 10px;font:600 14px/1.3 var(--f-body);text-align:center;opacity:0;transition:opacity .25s, transform .25s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(2px)}
#hint{flex:none;min-height:22px;font:600 14px/22px var(--f-body);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ka,.kb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font:700 10px/1 var(--f-display);vertical-align:-3px;margin:0 3px}
.ka{background:var(--btn-a)} .kb{background:var(--btn-b)}

/* Windows (panels) */
#panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,4,14,.5);padding:10px;box-sizing:border-box}
.win{width:min(380px,100%);max-height:100%;box-sizing:border-box;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;
  background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:3px solid var(--win-edge);border-radius:6px;
  box-shadow:0 0 0 3px #0a0820,0 8px 0 #0008;padding:12px 14px 14px;font:16px/1.35 var(--f-body);display:flex;flex-direction:column;gap:10px}
.win p{margin:0;max-width:60ch}
.win-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.win h2{font:700 14px/1.2 var(--f-display);letter-spacing:.06em;margin:0;text-transform:uppercase;color:var(--gold);text-wrap:balance}
.win h3{font:400 11px/1.2 var(--f-display);letter-spacing:.08em;margin:2px 0 -4px;text-transform:uppercase;color:var(--muted)}
.pbtn{font:600 15px/1.15 var(--f-body);color:var(--ink);background:var(--btn);border:2px solid var(--btn-edge);border-radius:4px;padding:8px 11px;
  cursor:pointer;touch-action:manipulation;text-align:left;display:flex;align-items:center;gap:9px;min-height:42px;position:relative}
.pbtn:hover{background:var(--btn-hi)}
.pbtn:focus-visible{background:var(--btn-hi);border-color:var(--win-edge);outline:none}
.pbtn:focus-visible::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:7px solid var(--gold);border-right:0}
.pbtn[aria-pressed="true"]{background:#5a3fb0;border-color:var(--gold)}
.pbtn:disabled{opacity:.42;cursor:not-allowed}
.pbtn .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pbtn small{font-weight:400;font-size:13px;color:var(--muted)}
.pbtn .cost{font:700 12px/1 var(--f-display);color:var(--gold);white-space:nowrap}
.pbtn.go{justify-content:center;background:#2f6a3a;border-color:var(--good);font-size:16px}
.pbtn.go:hover,.pbtn.go:focus-visible{background:#3f8a4a}
.x{min-height:32px;padding:4px 9px;font:700 12px var(--f-display)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.pbtn{flex:1 1 auto;justify-content:center}
.list{display:grid;gap:6px;padding-left:10px}
.card{display:flex;gap:12px;align-items:center}
.card .cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nm{font:700 18px/1.1 var(--f-body)}
.spr{width:56px;height:56px;image-rendering:pixelated;flex:none;background:#0a0d3366;border-radius:4px}
.spr.sm{width:34px;height:34px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font:400 10px/1 var(--f-display);padding:3px 5px;border-radius:3px;background:#0a0d33;letter-spacing:.04em}
.meter{height:8px;background:#0a0d33;border:1px solid var(--btn-edge);border-radius:2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ff6a8a,var(--gold))}
.muted{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--bad)}
.ab b{color:var(--gold)}
.sw{width:22px;height:22px;border:2px solid #0a0820;border-radius:3px;flex:none;image-rendering:pixelated}
.sw-meadow{background:#5fae46;box-shadow:inset 4px 4px 0 #7cc85a}
.sw-pond{background:#3b86d4;box-shadow:inset 0 4px 0 #a8dcff}
.sw-grove{background:#294a4c;box-shadow:inset 6px 6px 0 -3px #7ff0e8}
.sw-ember{background:#5c4648;box-shadow:inset 7px 7px 0 -2px #e2501a}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
details .row{margin-top:8px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dex>div{display:flex;flex-direction:column;gap:4px;padding:8px;background:#0a0d3366;border:1px solid #6a74c8;border-radius:4px;min-width:0}
.dex .top{display:flex;gap:8px;align-items:center}
.dex small{font-size:13px;color:var(--muted);line-height:1.25}
.stat{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:15px}

/* Title */
#title{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(rgba(14,8,34,.45),rgba(14,8,34,.86));padding:14px;box-sizing:border-box}
.tcard{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:440px}
.logo{display:flex;flex-direction:column;align-items:center;font:700 clamp(28px,8.6vw,50px)/.95 var(--f-display);color:var(--gold);
  text-shadow:0 3px 0 #c8641e,0 6px 0 #3a1e50,0 0 24px #ffd25a55;letter-spacing:.02em;text-transform:uppercase}
.logo span:last-child{color:#c8f0ff;text-shadow:0 3px 0 #5a7ad8,0 6px 0 #1a1e50,0 0 24px #9ef0f055}
.logo-sub{font:400 12px/1 var(--f-display);letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.tblurb{margin:0;font-size:16px;line-height:1.4;text-wrap:balance}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbtn.big{font:700 14px/1 var(--f-display);letter-spacing:.1em;padding:12px 26px;justify-content:center;background:#5a3fb0;border-color:var(--gold)}
.credit{margin:0;font:400 10px/1.2 var(--f-display);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
#tConfirm{display:flex;flex-direction:column;gap:8px}
#tConfirm p{margin:0}

/* Controller deck */
#deck{flex:none;height:132px;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 22px;
  background:linear-gradient(var(--deck-hi),var(--deck-lo));border-radius:66px;touch-action:none;
  box-shadow:inset 0 3px 0 #f2f0f6,inset 0 -5px 0 var(--deck-edge),0 4px 0 #000a}
#dpad{width:104px;height:104px;position:relative;flex:none;cursor:pointer;transition:transform .06s;touch-action:none}
#dpad::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(#00000022 60%,transparent 62%)}
#dpad i{position:absolute;background:linear-gradient(var(--dpad-hi),var(--dpad));border-radius:6px;box-shadow:0 3px 0 #1a1820}
#dpad .h{left:0;right:0;top:35%;height:30%}
#dpad .v{top:0;bottom:0;left:35%;width:30%}
#dpad b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#2a2832;box-shadow:inset 0 2px 0 #0006}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand{font:700 11px/1.25 var(--f-display);letter-spacing:.14em;color:var(--deck-ink)}
.keys{font:400 12px/1.3 var(--f-body);color:var(--deck-ink)}
.btns{position:relative;width:126px;height:112px;flex:none}
.pb{position:absolute;border:0;border-radius:50%;color:#fff;font:700 15px/1 var(--f-display);cursor:pointer;touch-action:none;transition:transform .05s, box-shadow .05s}
.pb.a{width:60px;height:60px;right:0;top:6px;background:radial-gradient(circle at 35% 30%,#c4b8ff,var(--btn-a) 55%,#7462c8);box-shadow:0 5px 0 var(--btn-a-lo),inset 0 -2px 0 #0002}
.pb.b{width:54px;height:54px;left:4px;bottom:14px;background:radial-gradient(circle at 35% 30%,#8e7cd8,var(--btn-b) 55%,#4a3a90);box-shadow:0 5px 0 var(--btn-b-lo),inset 0 -2px 0 #0002}
.pb.down{transform:translateY(4px);box-shadow:0 1px 0 #0004}
.cap{position:absolute;font:700 9px/1 var(--f-display);letter-spacing:.1em;color:var(--deck-ink)}
.capA{right:13px;top:78px}.capB{left:12px;bottom:0}
/* Build mode toolbar */
#buildbar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--win-top),var(--win-bot));border-top:3px solid var(--win-edge);
  box-shadow:0 -3px 0 #0a0820;padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px;font:14px/1.25 var(--f-body)}
.bb-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bb-info{color:var(--muted);min-width:0;font-size:14px}
.bb-info b{color:var(--gold);font-weight:600}
.tools{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:3px;scrollbar-width:thin}
.tool{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 4px;background:var(--btn);border:2px solid var(--btn-edge);
  border-radius:4px;color:var(--ink);font:600 12px/1.1 var(--f-body);cursor:pointer}
.tool img{width:32px;height:32px;image-rendering:pixelated}
.tool b{font:700 10px/1 var(--f-display);color:var(--gold)}
.tool[aria-pressed="true"]{background:#5a3fb0;border-color:var(--gold)}
.tool.locked{opacity:.5}
.say{margin:0;font-size:15px;line-height:1.35}
.qrow{display:flex;flex-direction:column;gap:2px;padding:6px 8px;background:#0a0d3366;border:1px solid #6a74c8;border-radius:4px}
.qrow small{color:var(--muted)}
.qrow.ok{border-color:var(--good)}
.tool:hover{background:var(--btn-hi)}
.biomes{display:flex;gap:6px;flex-wrap:wrap}
.biomes .pbtn{min-height:34px;padding:4px 9px;font-size:14px;flex:1 1 auto}
.biomes .pbtn .sw{width:16px;height:16px}
.done{font:700 12px/1 var(--f-display);letter-spacing:.06em;min-height:34px;padding:6px 12px;justify-content:center;background:#2f6a3a;border-color:var(--good)}
/* Tutorial guide */
#tut{position:absolute;left:8px;right:8px;top:8px;max-width:540px;margin:0 auto;display:flex;gap:10px;align-items:flex-start;
  background:linear-gradient(var(--win-top),var(--win-bot));border:3px solid var(--win-edge);border-radius:6px;box-shadow:0 0 0 3px #0a0820,0 6px 0 #0007;padding:8px 10px}
#tut img{width:40px;height:52px;image-rendering:pixelated;flex:none;background:#0a0d3388;border-radius:4px}
#tut .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
#tut .who{font:700 11px/1 var(--f-display);color:var(--gold);letter-spacing:.06em}
#tut p{margin:0;font:15px/1.32 var(--f-body);text-wrap:pretty}
#tut .tb{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
#tut .tb button{font:600 13px/1 var(--f-body);color:var(--ink);background:var(--btn);border:2px solid var(--btn-edge);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:30px}
#tut .tb .nx{background:#5a3fb0;border-color:var(--gold)}
#tut .tb .sk{background:transparent;border-color:transparent;color:var(--muted);text-decoration:underline}
#stage.tut #toast{top:auto;bottom:12px}
#stage.building #toast{top:auto;bottom:calc(var(--bbh,150px) + 10px)}
#stage.building.tut #toast{bottom:calc(var(--bbh,150px) + 10px)}
.hbtn.build{color:#10220f;background:#86e894;border-color:#e6ffe6}
@media (max-width:560px),(pointer:coarse){.keys{display:none}}
@media (max-width:380px){#deck{padding:0 14px}#dpad{width:94px;height:94px}.btns{width:116px}}
@media (prefers-reduced-motion:reduce){#toast,#dpad,.pb{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header id="hud">
    <span class="chip" title="Coins"><img id="icCoin" alt=""><span id="coins">0</span></span>
    <span class="chip" title="Berries"><img id="icBerry" alt=""><span id="berries">0</span></span>
    <span class="chip" id="compChip" hidden><img id="icComp" alt=""><small id="compName"></small></span>
    <span class="spacer"></span>
    <button class="hbtn build" id="btnBuild" type="button" hidden>Build</button>
    <button class="hbtn" id="btnBook" type="button">Journal</button>
    <button class="hbtn" id="btnMus" type="button" aria-pressed="true">Music</button>
    <button class="hbtn" id="btnSnd" type="button" aria-pressed="true">Sound</button>
  </header>
  <main id="stage">
    <canvas id="game" width="208" height="240"></canvas>
    <div id="buildbar" hidden></div>
    <div id="tut" hidden></div>
    <div id="toast" aria-live="polite"></div>
    <div id="panel" hidden></div>
    <div id="title">
      <div class="tcard">
        <div class="logo" aria-label="Animal Sanctuary"><span>Animal</span><span>Sanctuary</span></div>
        <div class="logo-sub">A magical creature adventure</div>
        <p class="tblurb">Explore magical wilds, befriend glowing creatures, and grow a sanctuary that visitors love.</p>
        <div class="tbtns"><button class="pbtn big" id="tStart" type="button">Start</button><button class="pbtn" id="tNew" type="button" hidden>New game</button></div>
        <div id="tConfirm" hidden><p>Erase this sanctuary and start over?</p><div class="row"><button class="pbtn" id="tYes" type="button">Erase it</button><button class="pbtn" id="tNo" type="button">Keep it</button></div></div>
        <p class="credit">Dreamed up by Maya &amp; Sam</p>
      </div>
    </div>
  </main>
  <div id="hint"></div>
  <div id="deck">
    <div id="dpad" role="group" aria-label="Direction pad"><i class="h"></i><i class="v"></i><b></b></div>
    <div class="mid"><div class="brand">ANIMAL<br>SANCTUARY</div><div class="keys">Arrows or WASD to move<br>Space = A &nbsp;·&nbsp; X = B</div></div>
    <div class="btns">
      <button id="bB" class="pb b" type="button" aria-label="B button: journal or close">B</button><span class="cap capB">BOOK</span>
      <button id="bA" class="pb a" type="button" aria-label="A button: act">A</button><span class="cap capA">ACT</span>
    </div>
  </div>
</div>

function sparks(x,y,n,col,sc=scene){for(let k=0;k<n;k++){const a=R()*6.28,s=20+R()*40;addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-15,g:50,life:.6+R()*.4,max:1,kind:'spark',col,scene:sc});}}
function poof(x,y,sc=scene){for(let k=0;k<10;k++){const a=R()*6.28,s=10+R()*25;addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,max:.5,kind:'poof',scene:sc});}}
function updParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);}
const DIG={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111','+':'000010111010000'};
function drawNum(str,x,y,col){let cx=Math.round(x-str.length*2);y=Math.round(y);for(const ch of str){const b=DIG[ch];if(b)for(let k=0;k<15;k++)if(b[k]==='1'){fill(ctx,'#2a1a10',cx+k%3+1,y+((k/3)|0)+1,1,1);fill(ctx,col,cx+k%3,y+((k/3)|0),1,1);}cx+=4;}}
function drawParts(){for(const p of parts){if(p.scene!==scene)continue;ctx.globalAlpha=clamp(p.life/p.max*2,0,1);const x=Math.round(p.x),y=Math.round(p.y);
  switch(p.kind){
    case'heart':ctx.drawImage(SM.heart,x-3,y-3);break;
    case'coin':ctx.drawImage(SM.coin,x-9,y-3);if(p.val)drawNum('+'+p.val,x+3,y-2,'#ffe27a');break;
    case'berry':ctx.drawImage(SM.berry,x-2,y-3);break;
    case'drop':ctx.drawImage(SM.drop,x-2,y-3);break;
    case'spark':fill(ctx,p.col||'#fff6b0',x,y,1,1);if(p.life>.4){fill(ctx,p.col||'#fff6b0',x-1,y,3,1);fill(ctx,p.col||'#fff6b0',x,y-1,1,3);}break;
    case'poof':fill(ctx,'#e8e4f4',x-1,y-1,Math.max(1,Math.round(p.life*6)),Math.max(1,Math.round(p.life*6)));break;}
}ctx.globalAlpha=1;}
function updAmbient(dt){if(reduceMotion||titleOpen&&scene!=='zoo'||scene==='home')return;const kind=scene==='wild'?ZONES[wild.zone].amb:'pollen';ambT-=dt;
  if(ambT<=0&&ambient.length<26){ambT=kind==='firefly'?.22:.4;ambient.push({x:camX+R()*VW,y:camY+R()*VH,vx:(R()-.5)*8,vy:kind==='ember'?-14-R()*12:kind==='pollen'?-3-R()*4:kind==='snow'?8+R()*8:(R()-.5)*6,life:3+R()*3,max:6,kind,ph:R()*6});}
  for(const a of ambient){a.x+=a.vx*dt+(a.kind==='firefly'?Math.sin(time*2+a.ph)*.3:0);a.y+=a.vy*dt;a.life-=dt;}ambient=ambient.filter(a=>a.life>0);}
function drawAmbient(){for(const a of ambient){const al=clamp(Math.min(a.life,a.max-a.life),0,1);const x=Math.round(a.x),y=Math.round(a.y);
  if(a.kind==='pollen'){ctx.globalAlpha=al*.8;fill(ctx,'#fff6c8',x,y,1,1);}
  else if(a.kind==='firefly'){const b=(Math.sin(time*5+a.ph)+1)/2;ctx.globalAlpha=al*b*.35;fill(ctx,'#d8ff7a',x-1,y-1,3,3);ctx.globalAlpha=al*b;fill(ctx,'#f0ffb0',x,y,1,1);}
  else if(a.kind==='snow'){ctx.globalAlpha=al*.9;fill(ctx,'#ffffff',x,y,a.ph>3?2:1,a.ph>3?2:1);}
  else {ctx.globalAlpha=al;fill(ctx,a.life>2?'#ffd040':'#ff7a2a',x,y,1,1);}}ctx.globalAlpha=1;}

const isPath=(i,j)=>i>=0&&j>=0&&i<ZW&&j<ZH&&state.zoo.path[j*ZW+i]==='1';
function spawnVisitor(){const W=zooWorld,ex=[12,13].filter(i=>W.dist[(ZH-1)*ZW+i]===0);if(!ex.length)return;const i=ex[(R()*ex.length)|0],j=ZH-1;
  visitors.push({i,j,ti:i,tj:j,pi:-1,pj:-1,x:i*16+8,y:j*16+12,ox:(R()-.5)*8,oy:(R()-.5)*5,v:(R()*VIS.length)|0,anim:R(),life:35+R()*35,leave:false,pause:0,paid:new Set(),seen:new Set(),bought:new Set()});
  if(!titleOpen)state.stats.visitors++;}
function vNext(v){const W=zooWorld;const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[v.i+a,v.j+b]).filter(([a,b])=>isPath(a,b)&&W.dist[b*ZW+a]>=0);if(!nb.length)return null;
  if(v.leave){let best=null,bd=1e9;for(const n of nb){const d=W.dist[n[1]*ZW+n[0]];if(d<bd){bd=d;best=n;}}return best;}
  let o=nb.filter(([a,b])=>!(a===v.pi&&b===v.pj));if(!o.length)o=nb;const ws=o.map(([a,b])=>v.seen.has(b*ZW+a)?1:4);
  let r=R()*ws.reduce((x,y)=>x+y,0);for(let k=0;k<o.length;k++)if((r-=ws[k])<=0)return o[k];return o[0];}
function payTip(v,amt){state.coins+=amt;state.stats.earned+=amt;if(wild)wild.homeCoins+=amt;
  addP({x:v.x,y:v.y-18,vy:-14,life:1.3,max:1.3,kind:'coin',val:amt,scene:'zoo'});if(scene==='zoo')sfx('coin');}
function vArrive(v){const W=zooWorld,k=v.j*ZW+v.i;v.seen.add(k);if(v.leave&&W.dist[k]===0){v.gone=true;return;}
  if(!titleOpen){for(const id of W.penAdj[k]||[]){if(v.paid.has(id))continue;v.paid.add(id);const val=penValue(penById(id));if(val>0){payTip(v,Math.max(1,Math.round(val*.5*charmMult())));v.pause=1.2;}}
    for(const d of W.shopAdj[k]||[]){if(v.bought.has(d))continue;v.bought.add(d);if(R()<.7){payTip(v,TOOL[d].shop);v.pause=1.6;}}}
  const n=vNext(v);if(!n){v.gone=true;return;}v.pi=v.i;v.pj=v.j;v.ti=n[0];v.tj=n[1];}
function updVisitor(v,dt){if(!isPath(v.i,v.j)||!isPath(v.ti,v.tj)){v.gone=true;poof(v.x,v.y-6,'zoo');return;}v.life-=dt;if(v.life<=0)v.leave=true;if(v.pause>0){v.pause-=dt;return;}
  const tx=v.ti*16+8+v.ox,ty=v.tj*16+12+v.oy,dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy),s=17*dt;v.anim+=dt;
  if(d<=s){v.x=tx;v.y=ty;v.i=v.ti;v.j=v.tj;vArrive(v);}else{v.x+=dx/d*s;v.y+=dy/d*s;}}
function simHome(dt){
  if(!titleOpen)for(const p of state.pens){if(!p.cid)continue;const c=getC(p.cid);if(c&&!c.away)c.happy=Math.max(0,c.happy-.3*dt);}
  const W=zooWorld;let reach=0;for(const p of state.pens)if(W.penReach.has(p.id)&&penValue(p)>0)reach++;
  visitorT-=dt;if(visitorT<=0){visitorT=Math.max(2,7-reach*.5-W.charm*.03)*(.7+R()*.6);if(reach>0&&visitors.length<16)spawnVisitor();}
  for(const v of visitors)updVisitor(v,dt);visitors=visitors.filter(v=>!v.gone);}
function updPens(dt){state.pens.forEach(p=>{if(!p.cid)return;const c=getC(p.cid);if(!c||c.away)return;
  const sp=SPR[c.sp][0],hw=Math.ceil(sp.width/2)+1,x0=(p.i+1)*16+hw,x1=Math.max(x0,(p.i+p.w-1)*16-hw),y0=Math.min((p.j+p.h-1)*16-1,(p.j+1)*16+Math.round(sp.height*.75)),y1=(p.j+p.h-1)*16-1;let m=penMot[c.id];
  if(!m||m.pen!==p.id)m=penMot[c.id]={pen:p.id,x:(x0+x1)/2,y:(y0+y1)/2,tx:(x0+x1)/2,ty:(y0+y1)/2,t:R()*2,face:1,moving:false,e:1+R()*3};
  m.t-=dt;if(m.t<=0){if(R()<.4){m.tx=m.x;m.ty=m.y;}else{m.tx=x0+R()*(x1-x0);m.ty=y0+R()*(y1-y0);}m.t=1.5+R()*2.5;}
  const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy);m.moving=d>1;if(d>1){const s=Math.min(d,12*dt);m.x+=dx/d*s;m.y+=dy/d*s;if(Math.abs(dx)>.5)m.face=dx>0?1:-1;}
  m.e-=dt;if(m.e<=0){m.e=3+R()*4;if(c.happy>70)hearts(m.x,m.y-14,1,'zoo');else if(c.happy<30)addP({x:m.x+6,y:m.y-16,vy:6,life:1,max:1,kind:'drop',scene:'zoo'});}});}

const PSZ={std:[6,4],grand:[9,6]};

const toolList=()=>scene==='home'?homeTools():TOOLS;
const toolDef=id=>scene==='home'?homeToolDef(id):TOOL[id];
function toolSize(t){if(!t)return[1,1];if(t.size)return PSZ[t.size];if(t.furn)return[FURN[t.furn].w,FURN[t.furn].h];return[1,1];}
function toolCost(t){if(!t)return 0;if(t.size==='std')return nextPenCost();if(t.size==='grand')return nextPenCost()+150;return t.cost||0;}
const fits=(c,p)=>!SPECIES[c.sp].huge||p.size==='grand';
const bb=$('#buildbar');
function playerTile(){return{i:Math.floor(player.x/16),j:Math.floor((player.y-2)/16)};}
function freeTile(i,j){if(i<1||j<1||i>ZW-2||j>ZH-2)return false;const k=j*ZW+i;if(FIXED.has(k)||state.zoo.path[k]==='1'||state.zoo.deco[k]||penAt(i,j))return false;return true;}
function placeProblem(t,i,j){if(scene==='home')return homeProblem(t,i,j);const pt=playerTile();
  if(t.size){const[w,h]=PSZ[t.size];for(let y=j;y<j+h;y++)for(let x=i;x<i+w;x++)if(!freeTile(x,y))return`This habitat needs a clear ${w} by ${h} patch of grass.`;
    if(pt.i>=i&&pt.i<i+w&&pt.j>=j&&pt.j<j+h)return'You are standing there!';return null;}
  if(!freeTile(i,j))return'That spot is taken.';if(t.id!=='path'&&pt.i===i&&pt.j===j)return'You are standing there!';return null;}
function setPath(i,j,v){const k=j*ZW+i,s=state.zoo.path;state.zoo.path=s.slice(0,k)+v+s.slice(k+1);}
function applyTool(i,j,quiet){const t=toolDef(tool);if(!t)return false;
  if(scene==='home')return homeApply(t,i,j,quiet);

  if(locked(t)){if(!quiet)toast(`Get the ${t.name} at Bram's Builders in town.`);return false;}
  const why=placeProblem(t,i,j);if(why){if(!quiet)toast(why);return false;}
  const cost=toolCost(t);if(state.coins<cost){if(!quiet)toast(`You need ${cost} coins for that.`);if(bmPtr)bmPtr.broke=1;return false;}
  state.coins-=cost;
  if(t.size){const[w,h]=PSZ[t.size],p={id:state.nextPen++,i,j,w,h,size:t.size,biome:biomeSel,cid:null};state.pens.push(p);tutEv.builtPen=true;sfx('unlock');
    const bur=burrowList().filter(b=>fits(b,p));if(bur.length){const pick=bur.find(b=>SPECIES[b.sp].huge)||bur.find(b=>ELEM[SPECIES[b.sp].el].home===p.biome)||bur[0];p.cid=pick.id;toast(`${SPECIES[pick.sp].name} moved in from the burrow!`);}
    sparks((i+w/2)*16,(j+h/2)*16,16,'#fff6b0');}
  else{if(t.id==='path'){setPath(i,j,'1');tutEv.path=true;}else state.zoo.deco[j*ZW+i]=t.id;sfx('blip');sparks(i*16+8,j*16+8,5,'#fff6b0');}
  buildZoo();save();renderBuildbar();return true;}
function bulldoze(i,j,quiet){const k=j*ZW+i,p=penAt(i,j);let refund=0;
  if(p){const idx=state.pens.indexOf(p);if(p.cid){const c=getC(p.cid);toast(`${SPECIES[c.sp].name} moved to the burrow.`);delete penMot[c.id];}
    state.pens.splice(idx,1);refund=nextPenCost()+(p.size==='grand'?150:0);poof((p.i+p.w/2)*16,(p.j+p.h/2)*16);}
  else if(state.zoo.deco[k]){refund=(TOOL[state.zoo.deco[k]]||{}).cost||0;delete state.zoo.deco[k];poof(i*16+8,j*16+8);}
  else if(state.zoo.path[k]==='1'&&!FIXED.has(k)){refund=2;setPath(i,j,'0');poof(i*16+8,j*16+8);}
  else{if(!quiet)toast(FIXED.has(k)?'That part of the sanctuary stays.':'Nothing to remove there.');return false;}
  state.coins+=refund;sfx('miss');buildZoo();save();renderBuildbar();return true;}
function toolIcon(t){const key='tool-'+t.id;if(URLC[key])return URLC[key];let c;

function curTileFrom(e){const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW+camX,y=(e.clientY-r.top)/r.height*VH+camY,t=toolDef(tool),[w,h]=toolSize(t);

function snapPen(i,j,t){const[w,h]=PSZ[t.size];let best=null,bs=1e9;for(let dj=-3;dj<=3;dj++)for(let di=-3;di<=3;di++){const a=i+di,b=j+dj;if(placeProblem(t,a,b))continue;
  const sc=Math.abs(di)+Math.abs(dj)+(touchesPath(a,b,w,h)?0:5);if(sc<bs){bs=sc;best={i:a,j:b};}}return best||{i,j};}
function camRange(){const ww=world.w*16,hh=world.h*16,extra=buildMode?Math.round((bb.offsetHeight||0)/((cvs.getBoundingClientRect().height/VH)||1)):0,H2=hh+extra;

cvs.addEventListener('pointerdown',e=>{if(!buildMode)return;e.preventDefault();ensureAudio();cvs.setPointerCapture(e.pointerId);const t=curTileFrom(e),td=toolDef(tool)||{};
  bmPtr={id:e.pointerId,sx:e.clientX,sy:e.clientY,cx:camX,cy:camY,mode:td.paint?'paint':(td.size||td.furn)?'ghost':'tap',last:-1,broke:0};cur=t;
  if(bmPtr.mode==='paint'){applyTool(t.i,t.j,true);bmPtr.last=t.j*ZW+t.i;}});

  const t=curTileFrom(e);
  if(bmPtr.mode==='paint'){const key=t.j*ZW+t.i;if(key!==bmPtr.last){const li=bmPtr.last%ZW,lj=(bmPtr.last/ZW)|0,n=Math.max(Math.abs(t.i-li),Math.abs(t.j-lj));
      for(let s=1;s<=n;s++){const i=Math.round(li+(t.i-li)*s/n),j=Math.round(lj+(t.j-lj)*s/n);applyTool(i,j,true);}bmPtr.last=key;}cur=t;}

  for(let k=0;k<4;k++)addP({x:(it.i+1)*16+(R()-.5)*20,y:it.j*16-6,vx:(R()-.5)*10,vy:-20-R()*10,life:1.2,max:1.2,kind:'spark',col:['#ffd860','#ff7aa8','#9ef0f0'][k%3]});}

/* ================= WILDS ================= */
function startExpedition(zk,cid,opts={}){
  const from=scene==='town'?{scene:'town',x:player.x,y:player.y}:{scene:'zoo'};
  const gen=buildWild(zk);
  const sparksL=[];for(let k=0;k<5;k++){const idx=gen.reach[(R()*gen.reach.length)|0];sparksL.push({x:(idx%gen.W.w)*16+8,y:((idx/gen.W.w)|0)*16+12,big:false});}
  for(const[i,j]of gen.islands)sparksL.push({x:i*16+8,y:j*16+12,big:true});
  if(zk==='meadow'&&state.quests.locket==='active'&&!(state.inv.locket>0)){for(let t=0;t<60;t++){const idx=gen.reach[(R()*gen.reach.length)|0],x=(idx%gen.W.w)*16+8,y=((idx/gen.W.w)|0)*16+12;if(Math.hypot(x-gen.spawn.x,y-gen.spawn.y)>140){sparksL.push({x,y,locket:true});break;}}}
  let clover=false;if(opts.clover&&(state.inv.clover||0)>0){state.inv.clover--;clover=true;}
  wild={zone:zk,W:gen.W,water:gen.water,bushes:gen.bushes,reach:gen.reach,spawn:gen.spawn,sparks:sparksL,crs:[],spawnT:.3,haul:{caught:[],berries:0,coins:0},homeCoins:0,clover,from};
  companion=null;if(cid){const c=getC(cid);if(c){c.away=true;companion={cid,sp:c.sp,x:gen.spawn.x-14,y:gen.spawn.y+18,face:1,moving:false,trail:[],fx:0};}}
  world=gen.W;scene='wild';ambient=[];player.x=gen.spawn.x;player.y=gen.spawn.y+20;player.face='down';snapCam();
  for(let k=0;k<3;k++)spawnWildCr(true);
  updCompChip();toast(ZONES[zk].name+(companion?` with ${SPECIES[companion.sp].name}`:'')+(clover?' · lucky clover!':''));sfx('unlock');
}
function returnHome(){
  if(companion){const c=getC(companion.cid);if(c)c.away=false;}
  const h=wild.haul,n=h.caught.length,home=wild.homeCoins,from=wild.from||{scene:'zoo'};
  toast(`Back! ${n?`${n} new friend${n>1?'s':''}`:'No new friends this trip'} · +${h.berries} berries · +${h.coins+home} coins`);
  companion=null;wild=null;ambient=[];updCompChip();
  if(from.scene==='town'){scene='town';world=townWorld;player.x=from.x;player.y=from.y;player.face='left';}else{scene='zoo';world=zooWorld;player.x=208;player.y=40;player.face='down';}
  snapCam();save();
  if(n&&burrowList().length)toast(burrowList().some(c=>SPECIES[c.sp].huge)&&!state.pens.some(p=>p.size==='grand'&&!p.cid)?'A giant friend is waiting by the burrow. It needs a Grand habitat (Bram\'s Builders sells the plans).':'Some new friends are waiting in the burrow. Tap Build to make a habitat for them.');
}
function spawnWildCr(first){
  const zk=wild.zone,le=lureEl(),lucky=has('lucky')||wild.clover;const cands=[];let tot=0;
  for(const k in SPECIES){const S=SPECIES[k];if(S.zone!==zk)continue;if(S.needs&&S.needs!==le)continue;
    if((S.rar===3||S.huge)&&wild.crs.some(c=>SPECIES[c.sp].rar===3||SPECIES[c.sp].huge))continue;if(S.swim&&!wild.water.length)continue;
    let w=RAR[S.rar].w;if(le&&S.el===le)w*=3;if(lucky&&S.rar>=2)w*=3;if(S.needs)w*=2.2;if((state.dex[k]||0)<2)w*=1.4;cands.push([k,w]);tot+=w;}
  if(!cands.length)return;let r=R()*tot,k=cands[0][0];for(const[kk,w]of cands){if((r-=w)<=0){k=kk;break;}}
  const S=SPECIES[k],pool=S.swim?wild.water:wild.reach;
  for(let t=0;t<50;t++){const idx=pool[(R()*pool.length)|0],x=(idx%wild.W.w)*16+8,y=((idx/wild.W.w)|0)*16+12,d=Math.hypot(x-player.x,y-player.y);
    if(d<(first?60:100)||d>(S.swim?320:240))continue;if(wild.crs.some(c=>Math.hypot(c.x-x,c.y-y)<(S.huge?60:30)))continue;
    if(S.huge&&!S.swim&&[[-1,0],[1,0],[0,-1]].some(([a,b])=>wild.W.solid[(((idx/wild.W.w)|0)+b)*wild.W.w+(idx%wild.W.w)+a]))continue;
    wild.crs.push({sp:k,x,y,vx:0,vy:0,t:R()*2,face:R()<.5?1:-1,moving:false,fx:R()});
    if(S.rar>=2&&!first)toast(S.huge?'The ground shakes… something ENORMOUS is nearby!':S.rar===3?'The ground rumbles… something legendary is near!':'A rare shimmer… something special is nearby!');return;}
}
const waterAt=(x,y)=>{const W=wild.W,i=Math.floor(x/16),j=Math.floor(y/16);return i>=0&&j>=0&&i<W.w&&j<W.h&&W.m[j*W.w+i]===T.WATER;};
function moveCr(c,dx,dy){const S=SPECIES[c.sp];if(S.swim){const nx=c.x+dx,ny=c.y+dy;if(waterAt(nx-10,ny-4)&&waterAt(nx+10,ny-4)&&waterAt(nx,ny)&&waterAt(nx,ny-10)){c.x=nx;c.y=ny;return false;}return true;}
  return moveEnt(c,dx,dy,S.huge?9:4,S.huge?5:4,false);}
function pickBush(b){const n=has('forage')?4:2;state.berries+=n;wild.haul.berries+=n;b.has=false;b.t=has('regrow')?3:40;
  for(let k=0;k<n;k++)addP({x:b.i*16+8+(R()-.5)*8,y:b.j*16+6,vx:(R()-.5)*20,vy:-30-R()*15,g:60,life:.8,max:.8,kind:'berry'});sfx('berry');}
function digSpark(sp){wild.sparks.splice(wild.sparks.indexOf(sp),1);
  if(sp.locket){addInv('locket',1);sparks(sp.x,sp.y-4,16,'#ff9ac0');sfx('unlock');toast("You found Nell's locket! Bring it to her in Willowbrook.");return;}
  const amt=(sp.big?40:8+((R()*8)|0))*(has('dig')?2:1);state.coins+=amt;wild.haul.coins+=amt;
  addP({x:sp.x,y:sp.y-10,vy:-16,life:1.3,max:1.3,kind:'coin',val:amt});sparks(sp.x,sp.y-4,12,'#ffe27a');sfx('treasure');}
function updWild(dt){
  for(const b of wild.bushes)if(!b.has){b.t-=dt;if(b.t<=0)b.has=true;}
  wild.spawnT-=dt;if(wild.spawnT<=0){wild.spawnT=2.5;if(wild.crs.length<5)spawnWildCr(false);}
  for(const c of wild.crs){if(catchG&&catchG.cr===c){c.moving=false;continue;}const S=SPECIES[c.sp];
    c.t-=dt;if(c.t<=0){if(R()<.35){c.vx=c.vy=0;c.t=1+R()*2;}else{const a=R()*6.28,sp=S.huge?6+R()*6:10+R()*12;c.vx=Math.cos(a)*sp;c.vy=Math.sin(a)*sp;c.t=1+R()*2.5;}}
    c.moving=!!(c.vx||c.vy);if(c.moving){if(moveCr(c,c.vx*dt,c.vy*dt))c.t=0;if(Math.abs(c.vx)>1)c.face=c.vx>0?1:-1;}
    c.fx-=dt;if(c.fx<=0){c.fx=.35;if(S.rar>=2)sparks(c.x+(R()-.5)*(S.huge?40:12),c.y-6-R()*(S.huge?30:10),1,'#fff6b0');}
    if((state.dex[c.sp]||0)<1&&Math.abs(c.x-player.x)<VW/2&&Math.abs(c.y-player.y)<VH/2){state.dex[c.sp]=1;toast(`New sighting: ${S.name}!`);}}
  wild.crs=wild.crs.filter(c=>!c.gone&&(Math.hypot(c.x-player.x,c.y-player.y)<(SPECIES[c.sp].swim?400:300)||(catchG&&catchG.cr===c)));
  if(has('magnet')){for(const b of wild.bushes)if(b.has&&Math.hypot(b.i*16+8-player.x,b.j*16+8-player.y)<34)pickBush(b);for(const sp of wild.sparks.slice())if(Math.hypot(sp.x-player.x,sp.y-player.y)<34)digSpark(sp);}
  if(companion){const tr=companion.trail,tg=tr.length>12?tr[tr.length-12]:null;
    if(tg){const dx=tg[0]-companion.x,dy=tg[1]-companion.y;companion.moving=Math.hypot(dx,dy)>1;companion.x+=dx*Math.min(1,dt*8);companion.y+=dy*Math.min(1,dt*8);if(Math.abs(dx)>.3)companion.face=dx>0?1:-1;}
    companion.fx-=dt;if(companion.fx<=0){companion.fx=.45;const S=SPECIES[companion.sp];sparks(companion.x+(R()-.5)*8,companion.y-8,1,ELEM[S.el].col);}}
}
function addCreature(sp){const c={id:state.nextId++,sp,happy:70,petT:0};state.owned.push(c);state.dex[sp]=2;
  let best=-1;state.pens.forEach((p,i)=>{if(p.cid||!fits(c,p))return;if(best<0)best=i;if(p.biome===ELEM[SPECIES[sp].el].home&&state.pens[best].biome!==p.biome)best=i;});
  if(best>=0)state.pens[best].cid=c.id;return best;}

/* ================= CATCHING ================= */
function startCatch(c){const S=SPECIES[c.sp],rr=RAR[S.rar],calm=has('calm');const zw=Math.min(.5,rr.zone*(calm?1.5:1));
  catchG={cr:c,pos:0,dir:1,speed:rr.speed*(calm?.85:1),zs:.1+R()*(.8-zw),zw,tries:2+(S.rar>=2?1:0),res:null,flash:0,miss:0};c.vx=c.vy=0;sfx('blip');}
function updCatch(dt){const g=catchG;g.miss=Math.max(0,g.miss-dt);if(g.res){g.flash-=dt;if(g.flash<=0)finishCatch();return;}
  g.pos+=g.dir*g.speed*dt;if(g.pos>1){g.pos=1;g.dir=-1;}if(g.pos<0){g.pos=0;g.dir=1;}}
function catchPress(){const g=catchG;if(g.res)return;const hit=g.pos>=g.zs&&g.pos<=g.zs+g.zw;
  if(hit){g.res='win';g.flash=.7;sfx('catch');sparks(g.cr.x,g.cr.y-8,18,'#fff6b0');hearts(g.cr.x,g.cr.y-10,4);}
  else{g.tries--;if(g.tries<=0){g.res='lose';g.flash=.5;sfx('fail');}else{g.miss=.35;sfx('miss');g.zs=.1+R()*(.8-g.zw);}}}
function finishCatch(){const g=catchG;catchG=null;const c=g.cr,S=SPECIES[c.sp];c.gone=true;
  if(g.res==='win'){tutEv.caught=true;const first=(state.dex[c.sp]||0)<2;const pi=addCreature(c.sp);wild.haul.caught.push(c.sp);
    toast(`${S.name} joined your sanctuary! ${pi>=0?'It moved into an empty habitat.':S.huge?'It needs a Grand habitat. For now it waits by the burrow.':'It is waiting in the burrow.'}`);if(first)toast(`New journal entry: ${S.name} · ${S.abName}`);save();}
  else{poof(c.x,c.y-6);toast(`${S.name} slipped away.`);}}

/* ================= INTERACTION ================= */
function findTarget(){const L=[];
  if(scene==='zoo'){
    const g=Math.hypot(player.x-208,player.y-24);if(g<22)L.push([g,{type:'gate'}]);
    const b=Math.hypot(player.x-248,player.y-34);if(b<20)L.push([b,{type:'board'}]);
    const bu=Math.hypot(player.x-160,player.y-34);if(bu<22)L.push([bu,{type:'burrow'}]);
    state.pens.forEach((p,i)=>{const rx=p.i*16,ry=p.j*16,rw=p.w*16,rh=p.h*16,py=player.y-4;const d=Math.hypot(player.x-clamp(player.x,rx,rx+rw),py-clamp(py,ry,ry+rh));if(d<10)L.push([d,{type:'pen',i}]);});
  }else if(scene==='town'){
    for(const b of BUILDINGS){const d=Math.hypot(player.x-(b.door*16+8),player.y-((b.y+b.h)*16+8));if(d<18)L.push([d,{type:'door',b}]);}
    for(const n of NPC_POS){const d=Math.hypot(player.x-n.x,player.y-n.y);if(d<20)L.push([d,{type:'npc',id:n.id}]);}
    for(const t of TRAILS){const d=Math.hypot(player.x-t.x,player.y-t.y);if(d<28)L.push([d+4,{type:'trail',t}]);}
  }else if(scene==='home'){
    for(const it of state.home.items){const Fu=FURN[it.f];if(!Fu||!(it.f==='bed'||Fu.play))continue;const cx=(it.i+Fu.w/2)*16,cy=(it.j+Fu.h)*16+4;
      const d=Math.hypot(Math.max(0,Math.abs(player.x-cx)-Fu.w*6),player.y-cy);if(d<12)L.push([d,{type:it.f==='bed'?'bed':'piano',it}]);}
  }else if(wild){
    for(const c of wild.crs){const S=SPECIES[c.sp],d=Math.hypot(c.x-player.x,c.y-player.y);if(d<(S.huge?50:24))L.push([d-(S.huge?24:6),{type:'cr',c}]);}
    for(const b of wild.bushes){if(!b.has)continue;const d=Math.hypot(b.i*16+8-player.x,b.j*16+8-player.y);if(d<20)L.push([d,{type:'bush',b}]);}
    for(const s of wild.sparks){const d=Math.hypot(s.x-player.x,s.y-player.y);if(d<15)L.push([d,{type:'spark',s}]);}
    const pd=Math.hypot(wild.spawn.x-player.x,wild.spawn.y-player.y);if(pd<16)L.push([pd+2,{type:'portal'}]);
  }
  L.sort((a,b)=>a[0]-b[0]);return L.length?L[0][1]:null;}
function label(t){switch(t.type){
  case'gate':return`${KA} Head into the wilds`;case'board':return`${KA} Ranger board · shop &amp; maps`;case'burrow':return`${KA} Peek into the burrow`;
  case'pen':{const p=state.pens[t.i];const c=p.cid&&getC(p.cid);return c?`${KA} Visit ${SPECIES[c.sp].name}`:`${KA} Choose who lives here`;}
  case'door':return t.b.id==='cottage'?`${KA} Go inside your cottage`:`${KA} Go into ${t.b.name}`;
  case'npc':return`${KA} Talk to ${NPCINFO[t.id].short}`;
  case'trail':return`${KA} Trail to ${ZONES[t.t.zone].name}${state.unlocked[t.t.zone]?'':' (locked)'}`;
  case'bed':return`${KA} Take a cozy nap`;case'piano':return`${KA} Play the piano`;
  case'cr':return`${KA} Befriend ${SPECIES[t.c.sp].name}`;case'bush':return`${KA} Pick berries`;case'spark':return t.s.locket?`${KA} Pick up the pink glint`:`${KA} Dig up treasure`;case'portal':return`${KA} Return home`;}}
function idleHint(){if(scene==='zoo')return state.pens.some(p=>!zooWorld.penReach.has(p.id))?'Some habitats need a path next to them':countHoused()?'Gate to the wilds at the top · town through the bottom entrance':'Visit an empty habitat to give a creature a home';

function updHint(){if(titleOpen){setHint('');return;}if(panelOpen){setHint(`${KB} close`);return;}

function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;fill(ctx,'#000',0,0,VW,VH);
  const cx=Math.round(camX),cy=Math.round(camY);ctx.save();ctx.translate(-cx,-cy);ctx.drawImage(world.canvas,0,0);shimmer(cx,cy);

  else{L.push({y:wild.spawn.y,d:drawPortal});for(const b of wild.bushes)if(b.has)L.push({y:b.j*16+15,d:()=>drawBerries(b)});
    for(const s of wild.sparks)L.push({y:s.y,d:()=>drawSparkle(s)});
    for(const c of wild.crs)L.push({y:c.y,d:()=>{drawCr(c.sp,c.x,c.y,c.face,c.moving,!!SPECIES[c.sp].swim);if(catchG&&catchG.cr===c)drawBang(c);}});
    if(companion)L.push({y:companion.y,d:()=>drawCr(companion.sp,companion.x,companion.y,companion.face,companion.moving,false)});
    if(has('sense'))L.push({y:1e6,d:drawSense});}
  L.push({y:player.y,d:drawPlayer});L.sort((a,b)=>a.y-b.y);for(const o of L)o.d();drawParts();if(buildMode)drawBuildOverlay();ctx.restore();
  if(scene==='wild'){const Z=ZONES[wild.zone];if(Z.dark)drawDark(cx,cy);if(Z.tint)fill(ctx,Z.tint,0,0,VW,VH);}
  ctx.save();ctx.translate(-cx,-cy);drawAmbient();ctx.restore();
  if(catchG)drawCatch();
  if(sleepFx>0){ctx.globalAlpha=Math.min(1,Math.sin(Math.min(1,sleepFx/2.4)*Math.PI)*1.2);fill(ctx,'#0a0820',0,0,VW,VH);ctx.globalAlpha=1;}}
function drawSense(){let best=null,bs=-1;for(const c of wild.crs){const d=Math.hypot(c.x-player.x,c.y-player.y),sc=SPECIES[c.sp].rar*1000-d;if(d>40&&sc>bs){bs=sc;best=c;}}if(!best)return;
  const a=Math.atan2(best.y-player.y,best.x-player.x);for(let k=0;k<3;k++){const r=14+k*9+((time*12)%9),x=Math.round(player.x+Math.cos(a)*r),y=Math.round(player.y-10+Math.sin(a)*r);fill(ctx,'#9ef0f0',x-1,y-1,3,3);fill(ctx,'#ffffff',x-1,y-1,1,1);}}

/* ================= INPUT ================= */
const keys=new Set(),KMAP={ArrowUp:'U',w:'U',W:'U',ArrowDown:'D',s:'D',S:'D',ArrowLeft:'L',a:'L',A:'L',ArrowRight:'R',d:'R',D:'R'};
let padDir={x:0,y:0};
addEventListener('keydown',e=>{const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();ensureAudio();
  if(panelOpen){if(k==='Escape'||k==='x'||k==='X'||k==='Backspace'){e.preventDefault();closePanel();return;}
    if(KMAP[k]==='D'||KMAP[k]==='R'){e.preventDefault();focusMove(1);return;}if(KMAP[k]==='U'||KMAP[k]==='L'){e.preventDefault();focusMove(-1);return;}
    if((k==='z'||k==='Z')&&!e.repeat){const el=document.activeElement;if(el&&panelEl.contains(el))el.click();}return;}
  if(titleOpen){if(document.activeElement&&titleEl.contains(document.activeElement)&&(k===' '||k==='Enter'))return;if(k===' '||k==='Enter'||k==='z'||k==='Z')startGame();return;}
  if(KMAP[k])keys.add(KMAP[k]);if(e.repeat)return;
  if(k===' '||k==='Enter'||k==='z'||k==='Z')pressA();else if(k==='x'||k==='X'||k==='Escape')pressB();});
addEventListener('keyup',e=>{if(KMAP[e.key])keys.delete(KMAP[e.key]);});
addEventListener('blur',()=>keys.clear());
const dpad=$('#dpad');let dpadPtr=null;
const OCT={'0':[1,0],'1':[1,1],'2':[0,1],'3':[-1,1],'4':[-1,0],'-4':[-1,0],'-3':[-1,-1],'-2':[0,-1],'-1':[1,-1]};
function dpadUpdate(e){const r=dpad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);let x=0,y=0;
  if(Math.hypot(dx,dy)>r.width*.12){[x,y]=OCT[String(Math.round(Math.atan2(dy,dx)/(Math.PI/4)))];}
  const prev=padDir;padDir={x,y};if((x||y)&&(x!==prev.x||y!==prev.y)&&panelOpen)focusMove(y?y:x);
  dpad.style.transform=`perspective(220px) rotateX(${-y*12}deg) rotateY(${x*12}deg)`;}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();dpad.setPointerCapture(e.pointerId);dpadPtr=e.pointerId;dpadUpdate(e);});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===dpadPtr)dpadUpdate(e);});
const dpEnd=e=>{if(e.pointerId!==dpadPtr)return;dpadPtr=null;padDir={x:0,y:0};dpad.style.transform='';};
dpad.addEventListener('pointerup',dpEnd);dpad.addEventListener('pointercancel',dpEnd);
function deckBtn(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();el.classList.add('down');fn();});
  const up=()=>el.classList.remove('down');el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up);
  el.addEventListener('click',e=>{if(e.detail===0)fn();});}
deckBtn($('#bA'),()=>{if(panelOpen){const el=document.activeElement;if(el&&panelEl.contains(el))el.click();else focusMove(0);}else pressA();});
deckBtn($('#bB'),()=>pressB());
$('#btnBook').addEventListener('click',()=>{ensureAudio();if(panelOpen)closePanel();if(!titleOpen&&!catchG)journalPanel();});
$('#btnSnd').addEventListener('click',e=>{ensureAudio();muted=!muted;e.currentTarget.setAttribute('aria-pressed',String(!muted));});
const btnMus=$('#btnMus');btnMus.setAttribute('aria-pressed',String(musicOn));
btnMus.addEventListener('click',()=>{musicOn=!musicOn;try{localStorage.setItem('as-music',musicOn?'on':'off');}catch(e){}btnMus.setAttribute('aria-pressed',String(musicOn));ensureAudio();if(mus.out){const t=AC.currentTime;mus.out.gain.cancelScheduledValues(t);mus.out.gain.setTargetAtTime(musicOn?.75:0,t,.3);if(musicOn)mus.next=t+.1;}});
/* iPad/iPhone: block double-tap and pinch zoom so the controller can't zoom the page */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<350&&!e.target.closest('button,summary,input'))e.preventDefault();lastTouchEnd=now;},{passive:false});

/* ================= TITLE & LOOP ================= */
function startGame(){if(!titleOpen)return;titleOpen=false;titleEl.hidden=true;ensureAudio();sfx('unlock');save();
  if(!state.tutDone){tutShow();return;}
  if(state.newTown){delete state.newTown;toast('New! Walk out the bottom entrance to explore Willowbrook town: shops, quests, your own cottage, and new wild places with GIANT creatures.');save();}
  if(state.newBuild){delete state.newBuild;toast('New! Tap Build at the top to design your sanctuary: habitats, paths, flowers and more.');toast('Visitors now follow your paths, so connect every habitat to one.');save();}
  else toast('Welcome back to the Animal Sanctuary!');}

/* ================= TUTORIAL ================= */
const RANGER=makeSprite([...P_HEAD.down,...P_BODY,...P_LEGS[0]],{G:'#7a5a2a',g:'#b08a48',b:'#8a9a4a',r:'#3f8a3a',N:'#6a3a20'});
const tutEl=$('#tut');
const nearCreaturePen=()=>{const t=findTarget();return !!(t&&t.type==='pen'&&state.pens[t.i].cid);};
const TUT=[
 {t:"Hi, I'm Ranger Fern! Welcome to your very own Animal Sanctuary. Let me show you around.",next:1},
 {t:"Walk with the D-pad or the arrow keys. Go say hi to Puffbun, the fluffy bunny in the habitat on the left.",done:nearCreaturePen},
 {t:"Press A to visit Puffbun, then tap Feed (or Pet). Happy creatures earn more coins.",done:()=>tutEv.fed},
 {t:"Visitors stroll along the paths. When they walk past a happy creature, they tip coins. That's how your sanctuary grows!",next:1},
 {t:"Let's build! Tap the green Build button at the top. Choose Habitat, pick Pond, then tap a grassy spot right next to a path.",
  enter(){const need=nextPenCost()+20;if(state.coins<need){state.coins=need;toast('Ranger Fern gave you some coins to build with!');}},done:()=>tutEv.builtPen},
 {t:"Visitors can only see habitats that touch a path. If yours doesn't, pick Path and drag to draw one. Flowers, trees and benches add Charm, which makes visitors tip more. Tap Done when you're finished.",
  done:()=>!buildMode&&state.pens.every(p=>zooWorld.penReach.has(p.id))},
 {t:"Now let's find new friends! Walk up the path to the gate at the top, press A, then Set off.",done:()=>scene==='wild'},
 {t:"Walk up to a creature and press A. Then press A again when the white marker is inside the green zone.",done:()=>tutEv.caught},
 {t:"You made a friend! New friends move into empty habitats. Press A next to bushes for berries and next to sparkles for coins.",next:1},
 {t:"When you're ready, walk onto the glowing portal and press A to go home.",done:()=>scene==='zoo'},
 {t:"The bottom entrance of your sanctuary leads to Willowbrook, the town. Its shops sell upgrades and furniture, and the townsfolk have quests for you. Go take a look!",done:()=>scene==='town'},
 {t:"Next time, bring a companion from the gate. Every creature has a special power, and some shy creatures only appear for the right friend. The Journal has clues. Have fun!",next:1},
];
let tutShown=-1;
function tutActive(){return !state.tutDone&&!titleOpen;}
function tutNextWaiting(){return tutActive()&&!tutEl.hidden&&TUT[state.tutStep]&&TUT[state.tutStep].next;}
function tutRender(){const s=TUT[state.tutStep];if(!s)return;tutShown=state.tutStep;
  tutEl.innerHTML=`<img src="${sprURL('ranger',RANGER,4)}" alt=""><div class="tt"><span class="who">Ranger Fern · ${state.tutStep+1}/${TUT.length}</span><p>${s.t}</p>
    <div class="tb"><button type="button" class="sk" data-t="skip">Skip tutorial</button>${s.next?`<button type="button" class="nx" data-t="next">${state.tutStep===TUT.length-1?'Finish':'Next'} ▸</button>`:''}</div></div>`;}
function tutShow(){if(TUT[state.tutStep]&&TUT[state.tutStep].enter&&tutShown!==state.tutStep)TUT[state.tutStep].enter();tutRender();}
function tutAdvance(){state.tutStep++;sfx('blip');if(state.tutStep>=TUT.length){tutFinish();return;}tutShow();save();}
function tutFinish(){state.tutDone=true;tutEl.hidden=true;stage.classList.remove('tut');save();toast('Tutorial complete. Enjoy your sanctuary!');}
function tutStart(){state.tutDone=false;state.tutStep=0;tutEv={};tutShown=-1;tutShow();}
tutEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ensureAudio();if(b.dataset.t==='next')tutAdvance();else if(b.dataset.t==='skip'){state.tutStep=TUT.length;tutFinish();}});
function tutTick(){if(!tutActive()){if(!tutEl.hidden){tutEl.hidden=true;stage.classList.remove('tut');}return;}
  if(tutShown!==state.tutStep)tutShow();const s=TUT[state.tutStep];
  if(s&&s.done&&s.done()){tutAdvance();return;}
  const hide=panelOpen;if(tutEl.hidden!==hide){tutEl.hidden=hide;stage.classList.toggle('tut',!hide);}}
$('#tStart').addEventListener('click',startGame);
$('#tNew').addEventListener('click',()=>{$('#tConfirm').hidden=false;$('#tYes').focus();});
$('#tNo').addEventListener('click',()=>{$('#tConfirm').hidden=true;$('#tStart').focus();});
$('#tYes').addEventListener('click',()=>{state=defaultState();penMot={};visitors=[];tutEv={};tutShown=-1;buildZoo();world=zooWorld;try{localStorage.removeItem(KEY);}catch(e){}$('#tConfirm').hidden=true;$('#tNew').hidden=true;$('#tStart').textContent='Start';startGame();});

let last=performance.now();
function update(dt){
  simHome(dt);if(catchG)updCatch(dt);
  const frozen=titleOpen||panelOpen||!!catchG||buildMode;let ix=0,iy=0;
  if(!titleOpen&&!panelOpen){if(keys.has('L'))ix--;if(keys.has('R'))ix++;if(keys.has('U'))iy--;if(keys.has('D'))iy++;ix=clamp(ix+padDir.x,-1,1);iy=clamp(iy+padDir.y,-1,1);}
  if(buildMode){if(ix||iy){bmRep-=dt;if(bmRep<=0){const[tw,th]=toolSize(toolDef(tool)),mi=Math.max(1,world.w-1-tw),mj=Math.max(1,world.h-1-th);cur.i=clamp(cur.i+ix,1,mi);cur.j=clamp(cur.j+iy,1,mj);bmRep=bmRep<-1?.09:.2;keepCurVisible();}}else bmRep=0;ix=iy=0;}
  if(frozen){ix=iy=0;}
  player.moving=!!(ix||iy);
  if(player.moving){const n=Math.hypot(ix,iy),sp=(scene==='wild'&&has('swift'))?98:62;moveEnt(player,ix/n*sp*dt,iy/n*sp*dt,4,4,scene==='wild'&&has('lavawalk'));
    player.face=Math.abs(ix)>Math.abs(iy)?(ix>0?'right':'left'):(iy>0?'down':'up');player.anim+=dt;if(player.anim>.14){player.anim=0;player.frame^=1;}
    if(companion){companion.trail.push([player.x,player.y]);if(companion.trail.length>40)companion.trail.shift();}}
  if(scene==='zoo'){updPens(dt);if(!buildMode&&player.y>(ZH-1)*16+11)goTown('zoo');}
  else if(scene==='town'){updTown(dt);if(player.y<10)goZoo();}
  else if(scene==='home'){if(!buildMode&&player.y>(homeWorld.h-1)*16+10)goTown('home');}
  else updWild(dt);
  if(sleepFx>0)sleepFx=Math.max(0,sleepFx-dt);
  updParts(dt);updAmbient(dt);
  if(!buildMode){const r=camRange(),tx=clamp(player.x-VW/2,r.x[0],r.x[1]),ty=clamp(player.y-8-VH/2,r.y[0],r.y[1]);
    const k=reduceMotion?1:Math.min(1,dt*8);camX+=(tx-camX)*k;camY+=(ty-camY)*k;}
  const showB=(scene==='zoo'||scene==='home')&&!titleOpen;if(btnBuild.hidden===showB)btnBuild.hidden=!showB;const bl=buildMode?'Done':scene==='home'?'Decorate':'Build';if(btnBuild.textContent!==bl)btnBuild.textContent=bl;
  tutTick();updHint();updHUD();saveT-=dt;if(saveT<=0){saveT=4;if(!titleOpen)save();}}
const btnBuild=$('#btnBuild');btnBuild.addEventListener('click',()=>{ensureAudio();if(buildMode)closeBuild();else openBuild();});
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;update(dt);draw();requestAnimationFrame(frame);}

function boot(data){
  const saved=load();state=migrate(data&&data.state)||saved||defaultState();if(!state.zoo)state=saved||defaultState();state.owned.forEach(c=>c.away=false);
  buildZoo();buildTown();buildHome();world=zooWorld;scene='zoo';player.x=208;player.y=40;snapCam();
  if(saved){$('#tStart').textContent='Continue';$('#tNew').hidden=false;}
  for(let k=0;k<300;k++)simHome(.1);
  resize();$('#tStart').focus({preventScroll:true});requestAnimationFrame(t=>{last=t;frame(t);});
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state}));}catch(e){}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
